apiVersion: v1
kind: Namespace
metadata:
  name: tenant-operator
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-operator
  namespace: tenant-operator
  labels:
    app.kubernetes.io/name: tenant-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: private-cloud-platform
spec:
  replicas: 1          # kopf is a single active reconciler; see README for HA notes
  revisionHistoryLimit: 3
  strategy:
    type: Recreate     # never two reconcilers at once
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: tenant-operator
      automountServiceAccountToken: true   # required: the operator talks to the API server
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # In production pin by digest (image@sha256:...) from the CI build, not a tag.
          image: tenant-operator:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp           # writable scratch space while the root filesystem stays read-only
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-operator-metrics
  namespace: tenant-operator
  labels:
    app.kubernetes.io/name: tenant-operator
spec:
  selector:
    app.kubernetes.io/name: tenant-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
