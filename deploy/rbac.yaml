apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-operator
  namespace: tenant-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-operator
rules:
  # Own CRD and its status
  - apiGroups: [platform.example.io]
    resources: [tenants, tenants/status]
    verbs: [get, list, watch, patch, update]
  # Lets owner references set blockOwnerDeletion when OwnerReferencesPermissionEnforcement is on
  - apiGroups: [platform.example.io]
    resources: [tenants/finalizers]
    verbs: [update]
  # kopf peering and event posting
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create]
  # Objects created per tenant
  - apiGroups: [""]
    resources: [namespaces, resourcequotas, limitranges]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch, create, patch]
  # Needed to grant the built-in edit ClusterRole via RoleBinding
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [edit]
    verbs: [bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-operator
subjects:
  - kind: ServiceAccount
    name: tenant-operator
    namespace: tenant-operator
