# Nothing may connect to the operator except Prometheus scraping /metrics.
# Kubelet health probes come from the node and are not blocked by NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-operator-ingress
  namespace: tenant-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tenant-operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
