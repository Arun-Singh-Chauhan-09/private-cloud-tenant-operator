apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.platform.example.io
spec:
  group: platform.example.io
  scope: Cluster
  names:
    kind: Tenant
    plural: tenants
    singular: tenant
    shortNames: [tn]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Owners
          type: string
          jsonPath: .spec.ownersGroup
        - name: CPU
          type: string
          jsonPath: .spec.quota.cpu
        - name: GPUs
          type: integer
          jsonPath: .spec.quota.gpus
        - name: Mesh
          type: boolean
          jsonPath: .spec.mesh.enabled
        - name: Phase
          type: string
          jsonPath: .status.reconcile.phase
      schema:
        openAPIV3Schema:
          type: object
          # Rejected by the API server itself, before the operator ever sees it.
          x-kubernetes-validations:
            - rule: "size(self.metadata.name) <= 63"
              message: tenant name must be at most 63 characters (it becomes a namespace)
            - rule: >-
                !self.metadata.name.startsWith('kube-') &&
                !(self.metadata.name in ['default', 'tenant-operator', 'monitoring', 'istio-system'])
              message: tenant name is reserved for the platform
          properties:
            spec:
              type: object
              required: [ownersGroup]
              properties:
                ownersGroup:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Identity-provider group bound to the edit ClusterRole in the tenant namespace.
                monitoringNamespace:
                  type: string
                  default: monitoring
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  maxLength: 63
                quota:
                  type: object
                  properties:
                    cpu:
                      type: string
                      default: "4"
                      pattern: "^[0-9]+(\\.[0-9]+)?m?$"
                    memory:
                      type: string
                      default: 16Gi
                      pattern: "^[0-9]+(\\.[0-9]+)?(k|M|G|T|P|Ki|Mi|Gi|Ti|Pi)?$"
                    gpus:
                      type: integer
                      minimum: 0
                      maximum: 64
                      default: 0
                storage:
                  type: array
                  maxItems: 10
                  # One entry per storage class: the API server rejects duplicates.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [storageClass]
                  items:
                    type: object
                    required: [storageClass, requests]
                    properties:
                      storageClass:
                        type: string
                        pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        maxLength: 63
                      requests:
                        type: string
                        pattern: "^[0-9]+(\\.[0-9]+)?(k|M|G|T|P|Ki|Mi|Gi|Ti|Pi)?$"
                      maxClaims:
                        type: integer
                        minimum: 1
                        maximum: 1000
                        default: 10
                mesh:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
