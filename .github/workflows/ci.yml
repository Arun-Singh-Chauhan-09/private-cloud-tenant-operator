# Mirror of .gitlab-ci.yml so the pipeline also runs on GitHub, where this repo is hosted.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token
permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy dependency and config scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.57.1 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 operator/
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.57.1 \
            config --severity HIGH,CRITICAL --exit-code 1 .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.7.4
      - run: ruff check operator/ && ruff format --check operator/
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install --no-document puppet:8.10.0 puppet-lint
      - run: |
          puppet parser validate puppet/modules/k8s_node/manifests/*.pp puppet/examples/site.pp
          puppet epp validate puppet/modules/k8s_node/templates/*.epp
          puppet-lint --fail-on-warnings --no-documentation-check puppet/modules
      - name: kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas deploy/ examples/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r operator/requirements-dev.txt
      - run: cd operator && python -m pytest -q

  kind-e2e:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, security-scan]
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: bash hack/e2e.sh
